<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Digital Garden | Home</title>
    <style>
        :root {
            --primary: #2d3436;
            --accent: #0984e3;
            --bg: #f5f6fa;
            --text: #2d3436;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 800px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--primary);
        }

        header p {
            color: #636e72;
            margin-bottom: 30px;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .nav-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #eee;
        }

        .nav-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
            border-color: var(--accent);
        }

        .nav-card h3 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
        }

        .nav-card p {
            margin: 0;
            font-size: 0.85rem;
            color: #b2bec3;
        }

        .search-box {
            margin-top: 20px;
        }

        input[type="text"] {
            padding: 12px 20px;
            width: 60%;
            border-radius: 25px;
            border: 1px solid #dfe6e9;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            width: 80%;
            border-color: var(--accent);
        }

        footer {
            margin-top: 50px;
            font-size: 0.9rem;
            color: #b2bec3;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Personal Gateway</h1>
        <p>A collection of my daily tools and creative projects.</p>
    </header>

    <div class="search-box">
        <form action="https://www.google.com/search" method="get">
            <input type="text" name="q" placeholder="Search the web..." autocomplete="off">
        </form>
    </div>

    <div style="margin: 40px 0;"></div>

    <div class="nav-grid">
        <a href="https://github.com" class="nav-card">
            <h3>GitHub</h3>
            <p>Code Repositories</p>
        </a>
        <a href="https://medium.com" class="nav-card">
            <h3>Blog</h3>
            <p>Technical Notes</p>
        </a>
        <a href="https://unsplash.com" class="nav-card">
            <h3>Photos</h3>
            <p>Photography Works</p>
        </a>
        <a href="https://linkedin.com" class="nav-card">
            <h3>Connect</h3>
            <p>Professional Profile</p>
        </a>
    </div>

    <footer>
        &copy; 2025 My Digital Identity. Built with Node.js on Alwaysdata.
    </footer>
</div>

</body>
</html>
